<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>MindPond · 实时记忆图谱</title><link rel="stylesheet" href="./assets/graph.css?v=15"><script defer src="./assets/graph-renderer.js?v=15"></script><script defer src="./assets/graph-page.js?v=15"></script></head>
<body><div class="shell">
<header class="topbar"><a class="brand" href="./" aria-label="返回 MindPond 工作台"><span class="brand-mark">◉</span><span>MindPond<small>LIVE MEMORY GRAPH</small></span></a><div class="top-center"><span class="signal" id="signal"></span><span id="streamStatus">连接中</span><span class="top-separator">/</span><span id="graphCount">等待记忆图谱</span></div><div class="top-actions"><button id="fit" title="显示全部节点">◎ 全景</button><a href="./">返回工作台 ↗</a></div></header>
<main class="workspace"><section class="stage-wrap" aria-label="实时记忆空间图谱"><div class="stage" id="graphStage"></div><div class="ambient" aria-hidden="true"></div><div id="bubbles" class="bubbles" aria-live="polite"></div><div class="stage-bottom"><div id="activityToast" class="activity-toast"><span class="tiny-light"></span><span>等待 agent 的下一次动作</span></div><div class="zoom-controls"><button id="zoomOut" aria-label="缩小图谱">−</button><button id="zoomIn" aria-label="放大图谱">+</button></div><div class="legend" title="按用户定义的维度显示颜色和数量"></div></div></section>
<aside class="side"><div class="side-top"><div class="eyebrow">LIVE TOPOLOGY / 记忆空间</div><h2>正在被唤起的记忆</h2><p class="control-intro">颜色区分记忆维度，双色节点连接两个维度。点击节点后，关联逐层传播并随相关性渐暗。</p><div class="controls"><label>空间<select id="space"><option value="">全部空间</option></select></label><label>记忆类型<select id="type"><option value="">全部类型</option></select></label><label>规模<select id="limit"><option value="500">最近 500 条</option><option value="1000" selected>最近 1000 条</option><option value="2000">最近 2000 条</option></select></label><label>渲染模式<select id="mode"><option value="auto">自动选择</option><option value="gpu">WebGL2 图形加速</option><option value="canvas">Canvas 兼容模式</option></select></label><label class="check"><input id="events" type="checkbox">显示原始事件记忆</label><button id="reload" class="accent">重新加载图谱 ↗</button></div><details class="credentials" id="credentials"><summary>连接凭据</summary><label>服务密钥<input id="apiKey" type="password" autocomplete="off" placeholder="API key（如已设置）"></label><label>管理凭据<input id="operatorKey" type="password" autocomplete="off" placeholder="Operator key（严格模式）"></label><button id="connect">连接</button></details><div class="backend" id="backend">检测渲染能力…</div></div>
<div class="inspector" id="inspector"><div class="eyebrow">SELECTED MEMORY / 当前记忆</div><div class="placeholder">点击图中的节点，或等待一次 agent 读取。记忆正文会显示在对应节点旁，也可在这里完整查看。</div></div>
<div class="feed-head"><div><div class="eyebrow">ACTIVITY / 动作流</div><h2>正在发生</h2></div><span class="live-pill">● LIVE</span></div><div id="activityFeed" class="feed"><div class="feed-empty">等待记忆操作…</div></div></aside></main><div id="error" role="alert" hidden></div></div><a class="license-link" href="/licenses/third-party.txt" target="_blank" rel="noopener">第三方许可</a></body></html>
